# Microservicio de tienda
spring.application.name=ms-tienda
server.port=8083

# MySQL de Laragon (usuario root sin contraseña). La base se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/museo_tienda?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Las tablas las crea schema.sql y los datos los carga data.sql cada vez que inicia el servicio.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

# Respuestas JSON sin campos nulos de más
spring.jackson.default-property-inclusion=non_null

# Dirección de ms-usuarios (la tienda le pregunta por los clientes)
usuarios.url=http://localhost:8081
